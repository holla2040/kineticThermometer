<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Two circles cross at two points, giving two ways to assemble the linkage"><title>Two circles cross at two points, giving two ways to assemble the linkage</title><rect width="760" height="430" fill="#0e1116"/><text x="380.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">Finding a joint means crossing two circles</text><text x="380.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Pin D has to be L5 from P and L6 from O6. Two circles. Two crossings.</text><circle cx="250.0" cy="220.0" r="145.0" fill="none" stroke="#4fd1c5" stroke-width="1.6" stroke-dasharray="4,4"/><circle cx="510.0" cy="220.0" r="145.0" fill="none" stroke="#63b3ed" stroke-width="1.6" stroke-dasharray="4,4"/><line x1="250.0" y1="220.0" x2="380.0" y2="155.8" stroke="#e8edf3" stroke-width="3" stroke-linecap="round"/><line x1="510.0" y1="220.0" x2="380.0" y2="155.8" stroke="#e8edf3" stroke-width="3" stroke-linecap="round"/><circle cx="380.0" cy="155.8" r="6" fill="#e8edf3"/><text x="380.0" y="141.77383710667436" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">D</text><line x1="250.0" y1="220.0" x2="380.0" y2="284.2" stroke="#9aa7b8" stroke-width="3" stroke-linecap="round"/><line x1="510.0" y1="220.0" x2="380.0" y2="284.2" stroke="#9aa7b8" stroke-width="3" stroke-linecap="round"/><circle cx="380.0" cy="284.2" r="6" fill="#9aa7b8"/><text x="380.0" y="308.22616289332564" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9aa7b8" text-anchor="middle" font-weight="bold" font-style="">D'</text><circle cx="510.0" cy="220.0" r="7.0" fill="#1c242f" stroke="#63b3ed" stroke-width="2"/><line x1="502.0" y1="227.0" x2="498.0" y2="233.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="506.0" y1="227.0" x2="502.0" y2="233.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="510.0" y1="227.0" x2="506.0" y2="233.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="514.0" y1="227.0" x2="510.0" y2="233.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="518.0" y1="227.0" x2="514.0" y2="233.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><circle cx="250.0" cy="220.0" r="6" fill="#4fd1c5"/><text x="234" y="225" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#4fd1c5" text-anchor="end" font-weight="bold" font-style="">P</text><text x="528" y="225" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63b3ed" text-anchor="start" font-weight="bold" font-style="">O6</text><text x="380.0" y="410" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Both are valid. The simulator picks one and stays on it — that is the "assembly branch" flip in the panel.</text></svg>