<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 350" width="790" height="350" role="img" aria-label="Where each preset falls on the transmission-angle scale"><title>Where each preset falls on the transmission-angle scale</title><rect width="790" height="350" fill="#0e1116"/><text x="395.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">How much angle do you actually need?</text><text x="395.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Every preset in this simulator, measured across its whole temperature range.</text><rect x="70" y="115" width="43.33333333333334" height="10" fill="#ef5350" opacity=".6"/><rect x="113.33333333333334" y="115" width="245.55555555555557" height="10" fill="#d9a441" opacity=".38"/><rect x="358.8888888888889" y="115" width="361.1111111111111" height="10" fill="#4fd1c5" opacity=".38"/><line x1="70.0" y1="106.0" x2="70.0" y2="134.0" stroke="#ef5350" stroke-width="2" stroke-linecap="round"/><text x="70.0" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">0°</text><line x1="113.3" y1="106.0" x2="113.3" y2="134.0" stroke="#ef5350" stroke-width="2" stroke-linecap="round"/><text x="113.33333333333334" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">6°</text><line x1="358.9" y1="106.0" x2="358.9" y2="134.0" stroke="#d9a441" stroke-width="2" stroke-linecap="round"/><text x="358.8888888888889" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">40°</text><line x1="720.0" y1="106.0" x2="720.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><text x="720.0" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">90°</text><text x="91.66666666666667" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">red zone</text><text x="236.11111111111111" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">workable, watch it</text><text x="539.4444444444445" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">comfortable</text><line x1="70.4" y1="200.0" x2="112.6" y2="200.0" stroke="#ef5350" stroke-width="6" stroke-linecap="round"/><circle cx="112.6" cy="200.0" r="5" fill="#ef5350"/><line x1="112.6" y1="136.0" x2="112.6" y2="193.0" stroke="#ef5350" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="120.6" y1="200.0" x2="394.2" y2="200.0" stroke="#ef5350" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="204" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="start" font-weight="normal" font-style="">the 11 search examples  (0.06° – 5.9°)</text><circle cx="125.6" cy="235.0" r="5" fill="#d9a441"/><line x1="125.6" y1="136.0" x2="125.6" y2="228.0" stroke="#d9a441" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="133.6" y1="235.0" x2="394.2" y2="235.0" stroke="#d9a441" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="239" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="start" font-weight="normal" font-style="">serpentine  7.7°</text><circle cx="314.8" cy="270.0" r="5" fill="#4fd1c5"/><line x1="314.8" y1="136.0" x2="314.8" y2="263.0" stroke="#4fd1c5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="322.8" y1="270.0" x2="394.2" y2="270.0" stroke="#4fd1c5" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="274" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="start" font-weight="normal" font-style="">Grand Arc  33.9°</text><text x="395.0" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">The two hand-tuned designs clear the red zone. Every search-found example sits inside it —</text><text x="395.0" y="336" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">because the search was told to make the scale as long as possible, and that is exactly where length comes from.</text></svg>