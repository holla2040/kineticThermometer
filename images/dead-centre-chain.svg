<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="The drive chain, showing which joints are watched for dead centre"><title>The drive chain, showing which joints are watched for dead centre</title><rect width="800" height="330" fill="#0e1116"/><text x="400.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">Where the two watched joints sit in the chain</text><text x="400.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Motion runs left to right. Each box is solved from the one before it.</text><rect x="12.0" y="128" width="96" height="44" rx="8" fill="none" stroke="#8fa2ba" stroke-width="1.6"/><text x="60" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">actuator</text><rect x="127.0" y="128" width="96" height="44" rx="8" fill="none" stroke="#d9a441" stroke-width="1.6"/><text x="175" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">bell crank</text><line x1="112.0" y1="150.0" x2="112.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="121.0,150.0 112.0,155.0 112.0,145.0" fill="#5a6472"/><rect x="262.0" y="128" width="46" height="44" rx="8" fill="none" stroke="#d9a441" stroke-width="1.6"/><text x="285" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">B</text><line x1="227.0" y1="150.0" x2="247.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="256.0,150.0 247.0,155.0 247.0,145.0" fill="#5a6472"/><rect x="357.0" y="128" width="46" height="44" rx="8" fill="none" stroke="#ef5350" stroke-width="2.5"/><text x="380" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">C</text><line x1="312.0" y1="150.0" x2="342.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="351.0,150.0 342.0,155.0 342.0,145.0" fill="#5a6472"/><rect x="457.0" y="128" width="46" height="44" rx="8" fill="none" stroke="#4fd1c5" stroke-width="1.6"/><text x="480" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">P</text><line x1="407.0" y1="150.0" x2="442.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="451.0,150.0 442.0,155.0 442.0,145.0" fill="#5a6472"/><rect x="552.0" y="128" width="46" height="44" rx="8" fill="none" stroke="#ef5350" stroke-width="2.5"/><text x="575" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">D</text><line x1="507.0" y1="150.0" x2="537.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="546.0,150.0 537.0,155.0 537.0,145.0" fill="#5a6472"/><rect x="652.0" y="128" width="96" height="44" rx="8" fill="none" stroke="#e8edf3" stroke-width="1.6"/><text x="700" y="155" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8edf3" text-anchor="middle" font-weight="normal" font-style="">Q  indicator</text><line x1="602.0" y1="150.0" x2="637.0" y2="150.0" stroke="#5a6472" stroke-width="2" stroke-linecap="round"/><polygon points="646.0,150.0 637.0,155.0 637.0,145.0" fill="#5a6472"/><line x1="380.0" y1="176.0" x2="380.0" y2="198.0" stroke="#ef5350" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/><text x="380" y="214" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">watched: angle between</text><text x="380" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">coupler and rocker</text><line x1="575.0" y1="176.0" x2="575.0" y2="198.0" stroke="#ef5350" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/><text x="575" y="214" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">watched: angle between</text><text x="575" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">coupler and rocker</text><text x="200" y="214" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">the actuator has its own</text><text x="200" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">0.5″ safety margin built in</text><text x="400.0" y="310" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">C and D are the only two joints found by crossing circles — so they are the only two that can go dead.</text></svg>