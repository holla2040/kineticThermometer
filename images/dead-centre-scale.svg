<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Near dead centre the scale marks bunch up and then jump"><title>Near dead centre the scale marks bunch up and then jump</title><rect width="780" height="300" fill="#0e1116"/><text x="390.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">What it does to the temperature scale</text><text x="390.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Each mark is one degree. Equal steps of temperature, unequal steps along the curve.</text><text x="30" y="94" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="start" font-weight="normal" font-style="">A healthy design — marks spread out gently</text><line x1="40.0" y1="106.0" x2="40.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="64.5" y1="106.0" x2="64.5" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="89.0" y1="106.0" x2="89.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="113.5" y1="106.0" x2="113.5" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="138.0" y1="106.0" x2="138.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="162.5" y1="106.0" x2="162.5" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="187.0" y1="106.0" x2="187.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="211.5" y1="106.0" x2="211.5" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="236.0" y1="106.0" x2="236.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="260.5" y1="106.0" x2="260.5" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><line x1="285.0