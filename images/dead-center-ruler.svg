<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 350" width="790" height="350" role="img" aria-label="Where each preset falls on the transmission-angle scale"><title>Where each preset falls on the transmission-angle scale</title><rect width="790" height="350" fill="#0e1116"/><text x="395.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">How much angle do you actually need?</text><text x="395.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Every preset in this simulator, measured across its whole temperature range.</text><rect x="70" y="115" width="43.33333333333334" height="10" fill="#ef5350" opacity=".6"/><rect x="113.33333333333334" y="115" width="245.55555555555557" height="10" fill="#d9a441" opacity=".38"/><rect x="358.8888888888889" y="115" width="361.1111111111111" height="10" fill="#4fd1c5" opacity=".38"/><line x1="70.0" y1="106.0" x2="70.0" y2="134.0" stroke="#ef5350" stroke-width="2" stroke-linecap="round"/><text x="70.0" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">0°</text><line x1="113.3" y1="106.0" x2="113.3" y2="134.0" stroke="#ef5350" stroke-width="2" stroke-linecap="round"/><text x="113.33333333333334" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">6°</text><line x1="358.9" y1="106.0" x2="358.9" y2="134.0" stroke="#d9a441" stroke-width="2" stroke-linecap="round"/><text x="358.8888888888889" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">40°</text><line x1="720.0" y1="106.0" x2="720.0" y2="134.0" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round"/><text x="720.0" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">90°</text><text x="91.66666666666667" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">red zone</text><text x="236.11111111111111" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">workable, watch it</text><text x="539.4444444444445" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">comfortable</text><line x1="70.4" y1="180.0" x2="112.6" y2="180.0" stroke="#ef5350" stroke-width="6" stroke-linecap="round"/><circle cx="112.6" cy="180.0" r="5" fill="#ef5350"/><line x1="112.6" y1="136.0" x2="112.6" y2="173.0" stroke="#ef5350" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="120.6" y1="180.0" x2="394.2" y2="180.0" stroke="#ef5350" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="184" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="start" font-weight="normal" font-style="">the 11 search examples  (0.06° – 5.9°)</text><circle cx="125.6" cy="209.0" r="5" fill="#d9a441"/><line x1="125.6" y1="136.0" x2="125.6" y2="202.0" stroke="#d9a441" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="133.6" y1="209.0" x2="394.2" y2="209.0" stroke="#d9a441" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="213" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="start" font-weight="normal" font-style="">serpentine  7.7°</text><line x1="119.8" y1="238.0" x2="252.7" y2="238.0" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/><circle cx="252.7" cy="238.0" r="5" fill="#d9a441"/><line x1="252.7" y1="136.0" x2="252.7" y2="231.0" stroke="#d9a441" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="260.7" y1="238.0" x2="394.2" y2="238.0" stroke="#d9a441" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="242" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="start" font-weight="normal" font-style="">the 6 shape presets  (6.9° – 25.3°)</text><circle cx="314.8" cy="267.0" r="5" fill="#4fd1c5"/><line x1="314.8" y1="136.0" x2="314.8" y2="260.0" stroke="#4fd1c5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="322.8" y1="267.0" x2="394.2" y2="267.0" stroke="#4fd1c5" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="402.22222222222223" y="271" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="start" font-weight="normal" font-style="">Grand Arc  33.9°</text><line x1="358.9" y1="296.0" x2="431.8" y2="296.0" stroke="#4fd1c5" stroke-width="6" stroke-linecap="round"/><circle cx="431.8" cy="296.0" r="5" fill="#4fd1c5"/><line x1="431.8" y1="136.0" x2="431.8" y2="289.0" stroke="#4fd1c5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><line x1="439.8" y1="296.0" x2="441.8" y2="296.0" stroke="#4fd1c5" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="449.8333333333333" y="300" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="start" font-weight="normal" font-style="">the 6 clean presets  (40.0° – 50.1°)</text><text x="395.0" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Everything except the length-search examples clears the red zone; all eleven of them sit inside it —</text><text x="395.0" y="342" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">because that search was told to make the scale as long as possible, and that is exactly where length comes from.</text></svg>