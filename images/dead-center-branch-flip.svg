<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 430" width="790" height="430" role="img" aria-label="After a snap-through the linkage settles on the mirror branch and reads wrong"><title>After a snap-through the linkage settles on the mirror branch and reads wrong</title><rect width="790" height="430" fill="#0e1116"/><text x="395.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">The failure you cannot see coming</text><text x="395.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Same actuator position. Same temperature. Two different readings.</text><line x1="130.0" y1="210.0" x2="215.0" y2="143.4" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/><line x1="300.0" y1="210.0" x2="215.0" y2="143.4" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/><line x1="215.0" y1="143.4" x2="257.5" y2="110.1" stroke="#4fd1c5" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,4"/><circle cx="130.0" cy="210.0" r="6" fill="#4fd1c5"/><circle cx="300.0" cy="210.0" r="7.0" fill="#1c242f" stroke="#63b3ed" stroke-width="2"/><line x1="292.0" y1="217.0" x2="288.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="296.0" y1="217.0" x2="292.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="300.0" y1="217.0" x2="296.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="304.0" y1="217.0" x2="300.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="308.0" y1="217.0" x2="304.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><circle cx="215.0" cy="143.4" r="6" fill="#4fd1c5"/><circle cx="257.5" cy="110.1" r="10.0" fill="none" stroke="#4fd1c5" stroke-width="2.5"/><text x="277.5" y="114.06126876931046" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4fd1c5" text-anchor="start" font-weight="normal" font-style="">indicator</text><text x="215" y="356" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#4fd1c5" text-anchor="middle" font-weight="bold" font-style="">How you built it</text><line x1="490.0" y1="210.0" x2="575.0" y2="276.6" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/><line x1="660.0" y1="210.0" x2="575.0" y2="276.6" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/><line x1="575.0" y1="276.6" x2="617.5" y2="309.9" stroke="#ef5350" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,4"/><circle cx="490.0" cy="210.0" r="6" fill="#4fd1c5"/><circle cx="660.0" cy="210.0" r="7.0" fill="#1c242f" stroke="#63b3ed" stroke-width="2"/><line x1="652.0" y1="217.0" x2="648.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="656.0" y1="217.0" x2="652.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="660.0" y1="217.0" x2="656.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="664.0" y1="217.0" x2="660.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="668.0" y1="217.0" x2="664.0" y2="223.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><circle cx="575.0" cy="276.6" r="6" fill="#ef5350"/><circle cx="617.5" cy="309.9" r="10.0" fill="none" stroke="#ef5350" stroke-width="2.5"/><text x="637.5" y="313.93873123068954" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#ef5350" text-anchor="start" font-weight="normal" font-style="">indicator</text><text x="575" y="356" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">After it snaps through once</text><text x="395.0" y="398" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Nothing breaks. Nothing looks bent. The sculpture just tells you the wrong temperature —</text><text x="395.0" y="418" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">and keeps telling you, until something knocks it back through.</text></svg>