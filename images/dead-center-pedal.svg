sans-serif" font-size="13" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">DEAD CENTER</text><text x="200" y="306" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Foot, crank and axle in one straight line.</text><text x="200" y="236" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="italic">no turning force at all</text><circle cx="560.0" cy="190.0" r="70.0" fill="none" stroke="#1e2733" stroke-width="2" stroke-dasharray="5,5"/><line x1="560.0" y1="190.0" x2="630.0" y2="190.0" stroke="#4fd1c5" stroke-width="6" stroke-linecap="round"/><circle cx="560.0" cy="190.0" r="7.0" fill="#1c242f" stroke="#63b3ed" stroke-width="2"/><line x1="552.0" y1="197.0" x2="548.0" y2="203.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="556.0" y1="197.0" x2="552.0" y2="203.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="560.0" y1="197.0" x2="556.0" y2="203.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="564.0" y1="197.0" x2="560.0" y2="203.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="568.0" y1="197.0" x2="564.0" y2="203.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><circle cx="630.0" cy="190.0" r="8" fill="#4fd1c5"/><line x1="630.0" y1="128.0" x2="630.0" y2="165.0" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/><polygon points="630.0,174.0 625.0,165.0 635.0,165.0" fill="#d9a441"/><text x="630.0" y="118.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">push</text><text x="560" y="285" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#4fd1c5" text-anchor="middle" font-weight="bold" font-style="">A QUARTER TURN LATER</text><text x="560" y="306" font-family="Helvetica,Arial,sans-serif" font-size="12" fi