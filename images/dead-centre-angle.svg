<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" width="790" height="400" role="img" aria-label="Transmission angle: healthy, tight, and dead centre"><title>Transmission angle: healthy, tight, and dead centre</title><rect width="790" height="400" fill="#0e1116"/><text x="395.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">The transmission angle</text><text x="395.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">The angle where the pushing link meets the link it drives. This is the number that matters.</text><line x1="66.7" y1="188.3" x2="140.0" y2="215.0" stroke="#5a6472" stroke-width="4" stroke-linecap="round"/><line x1="140.0" y1="215.0" x2="63.6" y2="291.4" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/><path d="M 108.1 203.4 A 34 34 0 0 0 116.0 239.0" fill="none" stroke="#4fd1c5" stroke-width="2.5"/><circle cx="140.0" cy="215.0" r="7" fill="#4fd1c5"/><circle cx="66.7" cy="188.3" r="5" fill="#8fa2ba"/><circle cx="63.6" cy="291.4" r="5" fill="#4fd1c5"/><text x="186" y="201" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#4fd1c5" text-anchor="start" font-weight="bold" font-style="">65°</text><text x="66.70397557869914" y="172.32242882059785" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">coupler</text><text x="63.632467631852876" y="315.3675323681471" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4fd1c5" text-anchor="middle" font-weight="normal" font-style="">driven link</text><text x="140" y="330" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#4fd1c5" text-anchor="middle" font-weight="bold" font-style="">HEALTHY</text><text x="140" y="351" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">90° is perfect. Above ~40° is normal practice.</text><line x1="326.7" y1="188.3" x2="400.0" y2="215.0" stroke="#5a6472" stroke-width="4" stroke-linecap="round"/><line x1="400.0" y1="215.0" x2="292.1" y2="218.8" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/><path d="M 368.1 203.4 A 34 34 0 0 0 366.0 216.2" fill="none" stroke="#d9a441" stroke-width="2.5"/><circle cx="400.0" cy="215.0" r="7" fill="#d9a441"/><circle cx="326.7" cy="188.3" r="5" fill="#8fa2ba"/><circle cx="292.1" cy="218.8" r="5" fill="#d9a441"/><text x="446" y="201" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#d9a441" text-anchor="start" font-weight="bold" font-style="">22°</text><text x="326.70397557869916" y="172.32242882059785" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">coupler</text><text x="292.06579068193764" y="242.76914564387013" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9a441" text-anchor="middle" font-weight="normal" font-style="">driven link</text><text x="400" y="330" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d9a441" text-anchor="middle" font-weight="bold" font-style="">GETTING TIGHT</text><text x="400" y="351" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">The driven link is starting to fight back.</text><line x1="581.7" y1="188.3" x2="655.0" y2="215.0" stroke="#8f4340" stroke-width="4" stroke-linecap="round"/><line x1="655.0" y1="215.0" x2="551.2" y2="185.2" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/><path d="M 623.1 203.4 A 34 34 0 0 0 622.3 205.6" fill="none" stroke="#ef5350" stroke-width="2.5"/><circle cx="655.0" cy="215.0" r="7" fill="#ef5350"/><circle cx="581.7" cy="188.3" r="5" fill="#8fa2ba"/><circle cx="551.2" cy="185.2" r="5" fill="#ef5350"/><text x="701" y="201" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#ef5350" text-anchor="start" font-weight="bold" font-style="">4°</text><text x="581.7039755786991" y="172.32242882059785" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">coupler</text><text x="551.1837368386616" y="209.2311655717641" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">driven link</text><text x="655" y="330" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">DEAD CENTRE</text><text x="655" y="351" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Below 6° the simulator paints this joint red.</text><text x="395.0" y="385" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Squeeze that angle to nothing and the driven link no longer knows which way to go.</text></svg>