<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="When the two circles are tangent the linkage is at dead centre"><title>When the two circles are tangent the linkage is at dead centre</title><rect width="760" height="430" fill="#0e1116"/><text x="380.0" y="30" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8edf3" text-anchor="middle" font-weight="bold" font-style="">Dead centre: the two crossings merge into one</text><text x="380.0" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Slide the circles apart until they only touch. Now there is no choice left.</text><circle cx="215.0" cy="215.0" r="145.0" fill="none" stroke="#4fd1c5" stroke-width="1.6" stroke-dasharray="4,4"/><circle cx="485.0" cy="215.0" r="125.0" fill="none" stroke="#63b3ed" stroke-width="1.6" stroke-dasharray="4,4"/><line x1="215.0" y1="215.0" x2="360.0" y2="215.0" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/><line x1="360.0" y1="215.0" x2="485.0" y2="215.0" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/><circle cx="360.0" cy="215.0" r="7" fill="#ef5350"/><circle cx="485.0" cy="215.0" r="7.0" fill="#1c242f" stroke="#63b3ed" stroke-width="2"/><line x1="477.0" y1="222.0" x2="473.0" y2="228.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="481.0" y1="222.0" x2="477.0" y2="228.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="485.0" y1="222.0" x2="481.0" y2="228.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="489.0" y1="222.0" x2="485.0" y2="228.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><line x1="493.0" y1="222.0" x2="489.0" y2="228.0" stroke="#5a6472" stroke-width="1.3" stroke-linecap="round"/><circle cx="215.0" cy="215.0" r="6" fill="#4fd1c5"/><text x="199" y="220" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#4fd1c5" text-anchor="end" font-weight="bold" font-style="">P</text><text x="360" y="197" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#ef5350" text-anchor="middle" font-weight="bold" font-style="">D</text><text x="503" y="220" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63b3ed" text-anchor="start" font-weight="bold" font-style="">O6</text><text x="360" y="249" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="italic">the two links are in one straight line</text><text x="380.0" y="392" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fa2ba" text-anchor="middle" font-weight="normal" font-style="">Nothing decides which way it comes off. Momentum, friction, gravity and joint slop do — not the actuator.</text><text x="380.0" y="414" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ef5350" text-anchor="middle" font-weight="normal" font-style="">Come out on the wrong side and the sculpture reads wrong until something knocks it back.</text></svg>